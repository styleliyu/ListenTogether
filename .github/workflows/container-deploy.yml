name: Container build and deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built commit to production
        required: true
        default: false
        type: boolean

concurrency:
  group: container-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/styleliyu/listentogether-web
  API_IMAGE: ghcr.io/styleliyu/listentogether-api
  PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN || 'https://podcast.still-fantasy.com' }}
  PRODUCTION_WEBSOCKET_URL: ${{ vars.PRODUCTION_WEBSOCKET_URL || 'wss://podcast.still-fantasy.com/ws' }}

jobs:
  validate:
    name: Validate application builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build web application
        run: |
          pnpm install --frozen-lockfile
          VITE_API_URL="$PRODUCTION_ORIGIN/api" \
          VITE_WEBSOCKET_URL="$PRODUCTION_WEBSOCKET_URL" \
          VITE_HEARTBEAT_PERIOD=15 \
          pnpm build

      - name: Build and test API
        working-directory: server
        run: |
          npm ci
          npm run build
          npm run --if-present test:netease-openapi
          npm run --if-present test:netease-auth

  build-web:
    name: Build web image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WEB_IMAGE }}:main
          build-args: |
            VITE_API_URL=${{ env.PRODUCTION_ORIGIN }}/api
            VITE_WEBSOCKET_URL=${{ env.PRODUCTION_WEBSOCKET_URL }}
            VITE_HEARTBEAT_PERIOD=15
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    name: Build API image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
            ${{ env.API_IMAGE }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy production
    needs:
      - build-web
      - build-api
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deployment files and deploy immutable image tag
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]

          key_file="$RUNNER_TEMP/listentogether-deploy-key"
          known_hosts_file="$RUNNER_TEMP/listentogether-known-hosts"
          install -m 600 /dev/null "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"

          ssh_options=(
            -i "$key_file"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )
          scp_options=(
            -i "$key_file"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
          )

          remote="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/opt/listentogether/incoming-${GITHUB_SHA}"

          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$incoming'"
          scp "${scp_options[@]}" deploy/compose.yml deploy/deploy.sh "$remote:$incoming/"
          ssh "${ssh_options[@]}" "$remote" \
            "install -m 0644 '$incoming/compose.yml' /opt/listentogether/compose.yml && \
             install -m 0750 '$incoming/deploy.sh' /opt/listentogether/deploy.sh && \
             rm -f '$incoming/compose.yml' '$incoming/deploy.sh' && \
             rmdir '$incoming' && \
             /opt/listentogether/deploy.sh 'sha-${GITHUB_SHA}'"
